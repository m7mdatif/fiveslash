<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Slash Cashier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brand: #E3401D;
    --brand-deep: #B72E12;
    --brand-tint: #FCE7E1;
    --accent: #EDA100;
    --accent-deep: #C98500;
    --accent-tint: #FBF0D9;
    --surface: #F5F4F1;
    --surface-card: #FFFFFF;
    --surface-sunken: #ECEAE5;
    --text-primary: #131313;
    --text-secondary: #5B5B58;
    --text-muted: #8B8B87;
    --border: rgba(19,19,19,0.12);
    --border-strong: rgba(19,19,19,0.2);
    --good: #1F8A3B;
    --good-tint: #E4F4E8;
    --danger: #A3242A;
    --danger-tint: #FBE9E9;
    --warn: #C98500;
    --shadow-sm: 0 1px 2px rgba(19,19,19,0.06);
    --shadow-md: 0 6px 20px rgba(19,19,19,0.10);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 22px;
    --font-display: "Anton", ui-sans-serif, system-ui, sans-serif;
    --font-body: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --brand: #FF5B37;
      --brand-deep: #E3401D;
      --brand-tint: #3A170D;
      --accent: #F4B93A;
      --accent-deep: #D99B1E;
      --accent-tint: #3A2C0E;
      --surface: #101010;
      --surface-card: #1A1A1A;
      --surface-sunken: #232323;
      --text-primary: #F5F4F1;
      --text-secondary: #B8B6B0;
      --text-muted: #807E79;
      --border: rgba(245,244,241,0.12);
      --border-strong: rgba(245,244,241,0.22);
      --good: #3FBE63;
      --good-tint: #163422;
      --danger: #E2726B;
      --danger-tint: #3A1E1D;
      --warn: #F4B93A;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 10px 30px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --brand: #FF5B37;
    --brand-deep: #E3401D;
    --brand-tint: #3A170D;
    --accent: #F4B93A;
    --accent-deep: #D99B1E;
    --accent-tint: #3A2C0E;
    --surface: #101010;
    --surface-card: #1A1A1A;
    --surface-sunken: #232323;
    --text-primary: #F5F4F1;
    --text-secondary: #B8B6B0;
    --text-muted: #807E79;
    --border: rgba(245,244,241,0.12);
    --border-strong: rgba(245,244,241,0.22);
    --good: #3FBE63;
    --good-tint: #163422;
    --danger: #E2726B;
    --danger-tint: #3A1E1D;
    --warn: #F4B93A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 10px 30px rgba(0,0,0,0.5);
  }

  *{ box-sizing: border-box; }
  body{
    direction: rtl;
    margin: 0;
    background: var(--surface);
    color: var(--text-primary);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  .app{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding: 18px 2px 10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:40px; height:40px; border-radius: 10px;
    background: #101010;
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow-sm); flex-shrink:0; overflow:hidden;
  }
  .brand-mark span{
    font-family: var(--font-display); color: var(--brand); font-size:26px;
    font-style: italic; transform: skewX(-12deg); line-height:1;
  }
  .brand-text h1{
    font-family: var(--font-display); font-weight:400; font-size: 21px;
    margin:0; line-height:1; letter-spacing: .01em; text-transform:uppercase;
  }
  .brand-text span{ font-size:11px; color: var(--text-secondary); letter-spacing:.04em; text-transform:uppercase; }
  .conn-pill{
    font-size:11.5px; padding: 5px 10px; border-radius: 999px;
    display:inline-flex; align-items:center; gap:6px; font-weight:600;
    border:1px solid var(--border);
    color: var(--text-secondary); background: var(--surface-card);
  }
  .conn-dot{ width:7px; height:7px; border-radius:50%; background: var(--text-muted); flex-shrink:0; }
  .conn-pill.ok{ color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); background: var(--good-tint); }
  .conn-pill.ok .conn-dot{ background: var(--good); }
  .conn-pill.off{ color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: var(--accent-tint); }
  .conn-pill.off .conn-dot{ background: var(--warn); }

  .local-banner{
    background: var(--accent-tint); border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    color: var(--accent-deep); border-radius: var(--radius-md);
    padding: 10px 14px; font-size:13px; margin: 0 2px 14px; display:flex; gap:8px; align-items:center;
  }
  .local-banner[hidden]{ display:none; }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; gap:6px; background: var(--surface-sunken);
    padding:5px; border-radius: var(--radius-md); margin: 0 2px 18px; width:fit-content;
  }
  .tab-btn{
    border:none; background:transparent; cursor:pointer;
    font-family: var(--font-body); font-weight:600; font-size:13.5px;
    color: var(--text-secondary); padding: 9px 18px; border-radius: 10px;
    transition: background .15s, color .15s;
  }
  .tab-btn.active{ background: var(--surface-card); color: var(--brand-deep); box-shadow: var(--shadow-sm); }

  /* ---------- POS layout ---------- */
  .pos-grid{ display:grid; grid-template-columns: 1fr 340px; gap:18px; align-items:start; }
  @media (max-width: 860px){ .pos-grid{ grid-template-columns: 1fr; } }

  .cat-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .cat-chip{
    border:1px solid var(--border); background: var(--surface-card); color: var(--text-secondary);
    font-family: var(--font-body); font-weight:600; font-size:13px; padding:8px 16px;
    border-radius:999px; cursor:pointer;
  }
  .cat-chip.active{ background: var(--brand); border-color: var(--brand); color:#fff; }

  .search-row{ margin-bottom:14px; }
  .search-row input{
    width:100%; padding:11px 14px; border-radius: var(--radius-md);
    border:1px solid var(--border); background: var(--surface-card); color: var(--text-primary);
    font-family: var(--font-body); font-size:14px;
  }
  .search-row input:focus{ outline:2px solid var(--brand); outline-offset:1px; }

  .item-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap:12px;
  }
  .item-card{
    background: var(--surface-card); border:1px solid var(--border); border-radius: var(--radius-md);
    padding:14px 12px; cursor:pointer; text-align:right; display:flex; flex-direction:column; gap:10px;
    transition: border-color .12s, transform .08s; box-shadow: var(--shadow-sm);
  }
  .item-card:hover{ border-color: var(--brand); }
  .item-card:active{ transform: scale(0.98); }
  .item-name{ font-weight:600; font-size:14.5px; line-height:1.3; }
  .item-cat{ font-size:11.5px; color: var(--text-muted); }
  .item-price{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight:600; color: var(--brand-deep); font-size:14px; }
  .item-price.out{ color: var(--danger); font-family: var(--font-body); font-weight:700; font-size:12.5px; }
  .item-card.out-of-stock{ opacity:.55; }
  .item-card.out-of-stock:hover{ border-color: var(--border); }
  .stock-pill{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight:600; font-size:12.5px; padding:3px 9px; border-radius:999px; display:inline-block; }
  .stock-pill.ok{ background: var(--good-tint); color: var(--good); }
  .stock-pill.low{ background: var(--accent-tint); color: var(--warn); }
  .stock-pill.out{ background: var(--danger-tint); color: var(--danger); }
  .recipe-panel{ background: var(--surface-sunken); border-radius: var(--radius-md); padding:12px; margin-top:8px; display:flex; flex-direction:column; gap:8px; }
  .recipe-line{ display:flex; gap:8px; align-items:center; }
  .recipe-line select{ flex:2; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background: var(--surface-card); color: var(--text-primary); font-size:13px; }
  .recipe-line input{ flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background: var(--surface-card); color: var(--text-primary); font-size:13px; width:0; }
  .recipe-line .unit-lbl{ font-size:11.5px; color: var(--text-muted); width:42px; flex-shrink:0; }
  .recipe-line button{ flex-shrink:0; }
  .recipe-summary{ font-size:11px; color: var(--text-muted); margin-top:2px; }
  .empty-note{ color: var(--text-muted); font-size:13.5px; padding: 30px 10px; text-align:center; }

  /* ---------- Cart ---------- */
  .cart{
    background: var(--surface-card); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding:16px; position: sticky; top:14px; box-shadow: var(--shadow-sm);
    display:flex; flex-direction:column; gap:12px; max-height: calc(100vh - 30px); overflow:auto;
  }
  .cart-head{ display:flex; align-items:center; justify-content:space-between; }
  .cart-head h2{ font-family: var(--font-display); font-size:17px; margin:0; font-weight:600; }
  .cart-count{ font-size:12px; color: var(--text-secondary); font-weight:600; }
  .cart-empty{ color: var(--text-muted); font-size:13.5px; text-align:center; padding: 24px 8px; }
  .cart-line{ display:flex; align-items:center; gap:10px; }
  .cart-line-info{ flex:1; min-width:0; }
  .cart-line-name{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cart-line-price{ font-size:12px; color: var(--text-muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .qty-ctl{ display:flex; align-items:center; gap:7px; background: var(--surface-sunken); border-radius:999px; padding:4px; }
  .qty-ctl button{
    width:22px; height:22px; border-radius:50%; border:none; background: var(--surface-card);
    color: var(--text-primary); font-size:14px; font-weight:700; cursor:pointer; line-height:1;
    box-shadow: var(--shadow-sm);
  }
  .qty-ctl span{ min-width:16px; text-align:center; font-size:13px; font-weight:600; font-variant-numeric: tabular-nums; }
  .cart-divider{ border-top:1px dashed var(--border-strong); margin:2px 0; }
  .cart-total-row{ display:flex; justify-content:space-between; align-items:baseline; }
  .cart-total-row .lbl{ font-size:13.5px; color: var(--text-secondary); }
  .cart-total-row .val{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight:700; font-size:20px; color: var(--brand-deep); }
  .pay-row{ display:flex; gap:7px; }
  .pay-btn{
    flex:1; padding:9px 4px; border-radius: 10px; border:1px solid var(--border); background: var(--surface-card);
    font-family: var(--font-body); font-weight:600; font-size:12.5px; cursor:pointer; color: var(--text-secondary);
  }
  .pay-btn.active{ background: var(--brand-tint); border-color: var(--brand); color: var(--brand-deep); }
  .checkout-btn{
    width:100%; padding:13px; border-radius: var(--radius-md); border:none; cursor:pointer;
    background: var(--accent); color:#2A1B04; font-family: var(--font-body); font-weight:700; font-size:15px;
    box-shadow: var(--shadow-sm);
  }
  .checkout-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .clear-btn{ background:none; border:none; color: var(--text-muted); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
  .customer-chip{ display:flex; align-items:center; justify-content:space-between; gap:8px; background: var(--brand-tint); border:1px solid color-mix(in srgb, var(--brand) 35%, transparent); border-radius:10px; padding:8px 10px; font-size:13px; }
  .customer-chip .who{ font-weight:600; color: var(--brand-deep); }
  .customer-chip .who small{ font-weight:500; color: var(--text-secondary); font-family: var(--font-mono); }
  .customer-chip button{ background:none; border:none; color: var(--text-muted); font-size:16px; cursor:pointer; line-height:1; }
  .customer-add-btn{ width:100%; padding:9px; border-radius:10px; border:1px dashed var(--border-strong); background:transparent; color: var(--text-secondary); font-family: var(--font-body); font-size:13px; cursor:pointer; }
  .customer-picker{ background: var(--surface-sunken); border-radius: var(--radius-md); padding:10px; display:flex; flex-direction:column; gap:8px; }
  .customer-picker input{ padding:9px 11px; border-radius:8px; border:1px solid var(--border); background: var(--surface-card); color: var(--text-primary); font-size:13px; }
  .customer-result{ display:flex; justify-content:space-between; padding:7px 9px; border-radius:8px; cursor:pointer; font-size:13px; }
  .customer-result:hover{ background: var(--surface-card); }
  .customer-result small{ color: var(--text-muted); font-family: var(--font-mono); }

  /* ---------- Sections / generic ---------- */
  .section-card{
    background: var(--surface-card); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding:18px; margin-bottom:16px; box-shadow: var(--shadow-sm);
  }
  .section-title{ font-family: var(--font-display); font-size:17px; font-weight:600; margin:0 0 14px; }
  .field-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .field{ display:flex; flex-direction:column; gap:5px; flex:1; min-width:130px; }
  .field label{ font-size:12px; color: var(--text-secondary); font-weight:600; }
  .field input, .field select{
    padding:10px 12px; border-radius:10px; border:1px solid var(--border); background: var(--surface);
    color: var(--text-primary); font-family: var(--font-body); font-size:13.5px;
  }
  .btn{
    padding:10px 18px; border-radius:10px; border:none; cursor:pointer; font-family: var(--font-body);
    font-weight:700; font-size:13.5px;
  }
  .btn-primary{ background: var(--brand); color:#fff; }
  .btn-ghost{ background: var(--surface-sunken); color: var(--text-primary); }
  .btn-danger{ background: var(--danger-tint); color: var(--danger); }
  .btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:8px; }

  table.data-table{ width:100%; border-collapse: collapse; font-size:13.5px; }
  table.data-table th{ text-align:right; color: var(--text-muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding:8px 8px; border-bottom:1px solid var(--border); }
  table.data-table td{ padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:middle; }
  table.data-table td.num, table.data-table th.num{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .menu-row-name{ font-weight:600; }
  .menu-row-cat{ font-size:11.5px; color: var(--text-muted); }
  .item-img{ width:100%; height:72px; object-fit:cover; border-radius:8px; background: var(--surface-sunken); display:block; }
  .item-img-placeholder{ width:100%; height:72px; border-radius:8px; background: var(--surface-sunken); display:flex; align-items:center; justify-content:center; font-size:24px; }
  .menu-row-thumb{ width:36px; height:36px; object-fit:cover; border-radius:7px; background: var(--surface-sunken); flex-shrink:0; }
  .menu-row-with-thumb{ display:flex; align-items:center; gap:10px; }

  .stat-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; margin-bottom:16px; }
  @media (max-width:760px){ .stat-grid{ grid-template-columns: repeat(2,1fr); } }
  .stat-tile{ background: var(--surface-card); border:1px solid var(--border); border-radius: var(--radius-md); padding:16px; box-shadow: var(--shadow-sm); }
  .stat-tile .lbl{ font-size:12px; color: var(--text-secondary); font-weight:600; margin-bottom:8px; }
  .stat-tile .val{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size:24px; font-weight:700; color: var(--brand-deep); }
  .stat-tile .sub{ font-size:11.5px; color: var(--text-muted); margin-top:4px; }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar-label{ width:150px; flex-shrink:0; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track{ flex:1; background: var(--surface-sunken); border-radius:999px; height:14px; overflow:hidden; }
  .bar-fill{ height:100%; background: linear-gradient(90deg, var(--brand), var(--accent)); border-radius:999px; min-width:4px; }
  .bar-value{ width:70px; text-align:left; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size:12.5px; color: var(--text-secondary); flex-shrink:0; }

  /* ---------- Modal / receipt ---------- */
  .modal-overlay{
    position:fixed; inset:0; background: rgba(10,14,12,0.55); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:16px;
  }
  .modal-overlay[hidden]{ display:none; }
  .receipt{
    background: var(--surface-card); width:100%; max-width:340px; border-radius: var(--radius-lg);
    padding:22px 20px; box-shadow: var(--shadow-md); max-height:88vh; overflow:auto;
  }
  .receipt-head{ text-align:center; margin-bottom:14px; }
  .receipt-head h3{ font-family: var(--font-display); margin:0 0 4px; font-size:19px; }
  .receipt-head div{ font-size:12px; color: var(--text-muted); }
  .receipt-num{ text-align:center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size:13px; color: var(--brand-deep); font-weight:700; margin-bottom:10px; }
  .receipt hr{ border:none; border-top:1px dashed var(--border-strong); margin:10px 0; }
  .receipt-line{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; gap:8px; }
  .receipt-line .n{ flex:1; }
  .receipt-line .p{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space:nowrap; }
  .receipt-total{ display:flex; justify-content:space-between; font-weight:700; font-size:16px; margin-top:8px; }
  .receipt-total .p{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--brand-deep); }
  .receipt-foot{ text-align:center; font-size:11.5px; color: var(--text-muted); margin-top:14px; }
  .modal-actions{ display:flex; gap:8px; margin-top:16px; }
  .modal-actions .btn{ flex:1; }
  .variant-opt-list{ display:flex; flex-direction:column; gap:8px; }
  .variant-opt-btn{
    display:flex; justify-content:space-between; align-items:center; width:100%;
    padding:12px 14px; border-radius:10px; border:1px solid var(--border-strong); background: var(--surface-card);
    color: var(--text-primary); font-family: var(--font-body); font-size:14px; font-weight:600; cursor:pointer;
  }
  .variant-opt-btn:hover{ border-color: var(--brand); }
  .variant-opt-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .variant-opt-btn .p{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--brand-deep); }

  .lock-box{
    width:100%; max-width:300px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .lock-brand{
    width:56px; height:56px; border-radius:14px; background:#1c1c1c; display:flex; align-items:center; justify-content:center;
    margin-bottom:6px;
  }
  .lock-brand span{ font-family: var(--font-display); color:#FF5B37; font-size:34px; font-style:italic; transform: skewX(-12deg); }
  .lock-box h2{ font-family: var(--font-display); color:#F5F4F1; font-size:24px; margin:0; letter-spacing:.02em; }
  .lock-sub{ color:#B8B6B0; font-size:13px; margin-bottom:10px; }
  .lock-sub.error{ color:#FF6B5B; }
  .pin-dots{ display:flex; gap:10px; margin-bottom:22px; height:14px; }
  .pin-dots span{ width:12px; height:12px; border-radius:50%; border:1.5px solid #565650; }
  .pin-dots span.filled{ background:#FF5B37; border-color:#FF5B37; }
  .pin-dots.shake{ animation: pinshake .35s; }
  @keyframes pinshake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
  .pin-pad{ display:grid; grid-template-columns: repeat(3, 64px); gap:14px; }
  .pin-key{
    width:64px; height:64px; border-radius:50%; border:1px solid #33332f; background:#1a1a1a; color:#F5F4F1;
    font-family: var(--font-mono); font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .pin-key:active{ background:#262622; }
  .pin-key.ghost{ background:transparent; border:none; color:#79857E; font-size:14px; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);

  var QR_GF = (function(){

      for (var j = 0; j < poly.length; j++) { res[j] ^= poly[j]; res[j + 1] ^= qrGfMul(poly[j], root); }
      poly = res;

    var maxBytes = ecInfo.data - 2;
    if (bytes.length > maxBytes) throw new Error('text too long for QR version 1 at this EC level (max ' + maxBytes + ' bytes)');

    for (i = 0; i < bytes.length; i++) bb.put(bytes[i], 8);

    var termLen = Math.min(4, capacityBits - bb.bits.length);

    function(r,c){ return (r+c)%2===0; },
    function(r,c){ return r%2===0; },
    function(r,c){ return c%3===0; },
    function(r,c){ return (r+c)%3===0; },
    function(r,c){ return (Math.floor(r/2)+Math.floor(c/3))%2===0; },
    function(r,c){ return ((r*c)%2)+((r*c)%3)===0; },
    function(r,c){ return (((r*c)%2)+((r*c)%3))%2===0; },
    function(r,c){ return (((r+c)%2)+((r*c)%3))%2===0; }

    ecLevel = ecLevel || 'M';

    var ecInfo = QR_EC_TABLE[ecLevel];

    for (i = 0; i < QR_SIZE; i++) { matrix.push(new Array(QR_SIZE).fill(false)); reserved.push(new Array(QR_SIZE).fill(false)); }
    function setModule(r, c, dark){ matrix[r][c] = !!dark; reserved[r][c] = true; }
    function placeFinder(r0, c0){

          if (r < 0 || r >= QR_SIZE || c < 0 || c >= QR_SIZE) continue;

          var dark = (dr === 0 || dr === 6 || dc === 0 || dc === 6) || (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4);
          setModule(r, c, dark);

    placeFinder(0, 0);
    placeFinder(0, QR_SIZE - 7);
    placeFinder(QR_SIZE - 7, 0);
    for (i = 8; i <= QR_SIZE - 9; i++) { setModule(6, i, i % 2 === 0); setModule(i, 6, i % 2 === 0); }
    setModule(4 * 1 + 9, 8, true); // dark module
    for (i = 0; i <= 8; i++) { if (!reserved[8][i]) reserved[8][i] = true; if (!reserved[i][8]) reserved[i][8] = true; }
    for (i = QR_SIZE - 8; i < QR_SIZE; i++) { if (!reserved[8][i]) reserved[8][i] = true; if (!reserved[i][8]) reserved[i][8] = true; }

    var bitIndex = 0, col = QR_SIZE - 1, upward = true;
    while (col > 0) {
      if (col === 6) col--;
      for (var rowStep = 0; rowStep < QR_SIZE; rowStep++) {
        var row = upward ? (QR_SIZE - 1 - rowStep) : rowStep;
        for (var cOff = 0; cOff < 2; cOff++) {
          var c2 = col - cOff;
          if (reserved[row][c2]) continue;
          var bit = bitIndex < allBits.length ? allBits[bitIndex] : 0;
          bitIndex++;
          var maskFlip = QR_MASK_FNS[maskPattern](row, c2);
          matrix[row][c2] = maskFlip ? (bit === 0) : (bit === 1);

      col -= 2;
    }

    var fBits = qrFormatBits(ecInfo.indicator, maskPattern);
    var fArr = [];
    for (i = 0; i < 15; i++) fArr.push((fBits >>> i) & 1);
    var seqA = [[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[7,8],[8,8],[8,7],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0]];
    for (i = 0; i < 15; i++) matrix[seqA[i][0]][seqA[i][1]] = fArr[i] === 1;
    var seqB = [];
    for (i = 0; i < 8; i++) seqB.push([8, QR_SIZE - 1 - i]);
    for (i = 0; i < 7; i++) seqB.push([QR_SIZE - 7 + i, 8]);
    for (i = 0; i < 15; i++) matrix[seqB[i][0]][seqB[i][1]] = fArr[i] === 1;

    return { size: QR_SIZE, matrix: matrix };
  }

    var modules = q.size, quiet = 4, px = 8;

  function initDb(){

    try{

    }catch(e){ state.dbReady = false; renderConn(); return; }

    // Claude account, nothing to type) - this just gives Firestore/Storage security
    // rules a "request.auth != null" check to require, instead of leaving the
    // database wide open to anyone on the internet who isn't even loading our app.
    firebase.auth().onAuthStateChanged(function(user){

            if(tuples) it.recipe = tuples.map(function(t){ return { ingredientId:t[0], qty:t[1] }; });
            // Backfill/refresh the default seed photo, but never touch a real admin-uploaded
            // photo (imgIsCustom) - that always wins over these built-in defaults.
            var defImg = DEFAULT_IMG_BY_ID[it.id];
            if(defImg && !it.imgIsCustom) it.img = defImg;
            return it;
          });
          DEFAULT_MENU.forEach(function(defIt){ if(!storedById[defIt.id]) merged.push(defIt); });
          state.menuItems = merged;
          writeMenuBatch(merged, MENU_SEED_VERSION).catch(function(){});
        }
        render();
      }

      menuDocRef.onSnapshot(function(snap){
        menuMeta = snap.exists ? snap.data() : null;
        menuMetaLoaded = true;
        applyMenuIfReady();
      }, function(){ /* ignore transient errors */ });

      menuItemsColRef.onSnapshot(function(qs){
        var list = [];
        qs.docs.forEach(function(d){ list.push(d.data()); });
        menuItemsRaw = list;
        menuItemsLoaded = true;
        applyMenuIfReady();
      }, function(){ /* ignore transient errors */ });

      ordersColRef.orderBy('createdAt','desc').limit(300).onSnapshot(function(qs){
        var list = [];
        qs.docs.forEach(function(d){ var data = d.data(); data._id = d.id; list.push(data); });
        state.orders = list;
        render();
      }, function(){ /* ignore transient errors */ });

      shiftsColRef.orderBy('openedAt','desc').limit(100).onSnapshot(function(qs){
        var list = [];
        qs.docs.forEach(function(d){ var data = d.data(); data._id = d.id; list.push(data); });
        state.shifts = list;
        render();
      }, function(){ /* ignore transient errors */ });

      customersColRef.orderBy('createdAt','desc').limit(500).onSnapshot(function(qs){
        var list = [];
        qs.docs.forEach(function(d){ var data = d.data(); data._id = d.id; list.push(data); });
        state.customers = list;
        render();
      }, function(){ /* ignore transient errors */ });

      staffDocRef.onSnapshot(function(snap){
        var data = snap.exists ? snap.data() : null;
        var storedVersion = data && typeof data.version === 'number' ? data.version : 0;
        if(data && storedVersion >= STAFF_SEED_VERSION){
          if(Array.isArray(data.members) && data.members.length){ state.staff = data.members; }
        } else {
          staffDocRef.set({ members: state.staff, version: STAFF_SEED_VERSION, updatedAt: new Date().toISOString() }).catch(function(){});
        }
        restoreSession();
        render();
      }, function(){ /* ignore transient errors */ });

      inventoryDocRef.onSnapshot(function(snap){
        var data = snap.exists ? snap.data() : null;
        var storedVersion = data && typeof data.version === 'number' ? data.version : 0;
        if(data && storedVersion >= INVENTORY_SEED_VERSION){
          if(Array.isArray(data.ingredients)){ state.inventory = data.ingredients; }
        } else {
          // First run, or an older seed that needs upgrading to the latest ingredient list.
          // Existing stock numbers for ingredients that still exist are kept; new ingredients start at 0.
          var prevById = {};
          (data && Array.isArray(data.ingredients) ? data.ingredients : []).forEach(function(g){ prevById[g.id] = g; });
          var merged = buildDefaultIngredients().map(function(g){
            var prev = prevById[g.id];
            return prev ? Object.assign({}, g, { stock: prev.stock, lowStockAt: prev.lowStockAt }) : g;
          });
          state.inventory = merged;
          inventoryDocRef.set({ ingredients: merged, version: INVENTORY_SEED_VERSION, updatedAt: new Date().toISOString() }).catch(function(){});
        }
        render();
      }, function(){ /* ignore transient errors */ });

      loyaltyDocRef.onSnapshot(function(snap){
        var data = snap.exists ? snap.data() : null;
        if(data && typeof data.earnEveryEGP === 'number' && typeof data.pointValueEGP === 'number'){
          state.loyaltySettings = { earnEveryEGP: data.earnEveryEGP, pointValueEGP: data.pointValueEGP };
        } else {
          loyaltyDocRef.set({ earnEveryEGP: state.loyaltySettings.earnEveryEGP, pointValueEGP: state.loyaltySettings.pointValueEGP, version: LOYALTY_SEED_VERSION, updatedAt: new Date().toISOString() }).catch(function(){});
        }
        render();
      }, function(){ /* ignore transient errors */ });
    }
  }

  /* ----- Auth / PIN login ----- */
  function saveSession(){
    try{ sessionStorage.setItem('pos_session_user', JSON.stringify(state.currentUser)); }catch(e){}
  }
  function restoreSession(){
    if(state.currentUser) return; // already logged in this page life
    try{
      var raw = sessionStorage.getItem('pos_session_user');
      if(raw){
        var u = JSON.parse(raw);
        // Re-validate against the current staff list (PIN may have been changed/removed).
        if(u && state.staff.some(function(s){ return s.id === u.id && s.role === u.role; })){
          state.currentUser = u;

      }

  function pinDigit(d){
    if(state.pinEntry.length >= 6) return;
    state.pinEntry += String(d);
    var match = state.staff.find(function(s){ return s.pin === state.pinEntry; });
    if(match){
      state.currentUser = { id: match.id, name: match.name, role: match.role };
      state.pinEntry = '';
      state.pinError = false;
      saveSession();
      if(!ALLOWED_TABS(state.currentUser.role).includes(state.tab)) state.tab = 'pos';
      render();
      return;
    }
    if(state.pinEntry.length >= 6){
      state.pinError = true;
      render();
      setTimeout(function(){ state.pinEntry = ''; state.pinError = false; render(); }, 500);
      return;
    }
    render();
  }
  window.pinDigit = pinDigit;
  function pinBackspace(){ state.pinEntry = state.pinEntry.slice(0,-1); state.pinError = false; render(); }
  window.pinBackspace = pinBackspace;
  function logout(){
    state.currentUser = null;
    state.pinEntry = '';

  /* ----- Recipe / stock helpers ----- */
  function findIngredient(id){ return state.inventory.find(function(g){ return g.id === id; }); }

  // Max additional units of `item` that current stock allows (Infinity if no recipe).
  function availableQty(item){
    if(!item || !Array.isArray(item.recipe) || !item.recipe.length) return Infinity;
    var max = Infinity;
    item.recipe.forEach(function(r){
      var ing = findIngredient(r.ingredientId);
      if(!ing) return; // stale/deleted ingredient reference: ignore this line
      if(!r.qty || r.qty <= 0) return;
      var can = Math.floor((ing.stock||0) / r.qty);
      if(can < max) max = can;
    });
    return max === Infinity ? Infinity : max;
  }

  function deductInventoryForCart(cart){
    var usage = {};
    var any = false;
    cart.forEach(function(line){
      var item = state.menuItems.find(function(i){ return i.id === (line.itemId||line.id); });
      if(item && Array.isArray(item.recipe)){
        item.recipe.forEach(function(r){
          usage[r.ingredientId] = (usage[r.ingredientId]||0) + r.qty*line.qty;
          any = true;
        });
      }
    });
    if(!any) return;
    state.inventory = state.inventory.map(function(ing){
      if(!usage[ing.id]) return ing;
      var next = Math.max(0, (ing.stock||0) - usage[ing.id]);
      return Object.assign({}, ing, { stock: next });
    });
    persistInventory();
  }

  /* ----- POS tab ----- */
  function renderPOS(){
    var cats = ['الكل'].concat(categories());
    var chips = cats.map(function(c){
      return '<button class="cat-chip'+(state.activeCategory===c?' active':'')+'" onclick="setCategory(\''+escAttr(c)+'\')">'+esc(c)+'</button>';
    }).join('');

    var q = state.searchQuery.trim().toLowerCase();
    var items = state.menuItems.filter(function(it){
      var matchCat = state.activeCategory === 'الكل' || it.category === state.activeCategory;
      var matchQ = !q || it.name.toLowerCase().indexOf(q) !== -1;
      return matchCat && matchQ;
    });

    var cards = items.map(function(it){
      var avail = availableQty(it);
      var out = avail <= 0;
      var hasVariants = Array.isArray(it.variants) && it.variants.length > 0;
      var priceHtml;
      if(out){ priceHtml = '<div class="item-price out">نفذت الكمية</div>'; }
      else if(hasVariants){
        var minP = Math.min.apply(null, it.variants.map(function(v){ return v.price; }));
        priceHtml = '<div class="item-price">من '+money(minP)+' ج.م</div>';
      } else {
        priceHtml = '<div class="item-price">'+money(it.price)+' ج.م</div>';
      }
      var imgHtml = it.img ? '<img class="item-img" src="'+escAttr(it.img)+'" alt="">' : '<div class="item-img-placeholder">☕</div>';
      return '<div class="item-card'+(out?' out-of-stock':'')+'" onclick="addToCart(\''+escAttr(it.id)+'\')">'
        + imgHtml
        + '<div><div class="item-name">'+esc(it.name)+'</div><div class="item-cat">'+esc(it.category)+'</div></div>'
        + priceHtml
        + '</div>';
    }).join('') || '<div class="empty-note">مفيش أصناف مطابقة</div>';

    return '<div class="pos-grid">'
      + '<div>'
        + '<div class="search-row"><input type="text" placeholder="دور على صنف…" value="'+escAttr(state.searchQuery)+'" oninput="onSearch(this.value)"></div>'
        + '<div class="cat-row">'+chips+'</div>'
        + '<div class="item-grid">'+cards+'</div>'
      + '</div>'
      + renderCart()

  function renderCart(){

      return '<div class="cart-line">'
        + '<div class="cart-line-info"><div class="cart-line-name">'+esc(l.name)+'</div><div class="cart-line-price">'+money(l.price)+' ج.م × '+l.qty+'</div></div>'

      return '<button class="pay-btn'+(state.payMethod===p?' active':'')+'" onclick="setPayMethod(\''+p+'\')">'+p+'</button>';
    }).join('');

  }

  function cartTotal(){ return state.cart.reduce(function(s,l){ return s + l.price*l.qty; }, 0); }

  /* ----- Discounts & loyalty points (inside the cart) ----- */
  function attachedCustomerRecord(){
    if(!state.attachedCustomer) return null;
    var full = state.customers.find(function(c){ return c._id === state.attachedCustomer.id; });
    return full || state.attachedCustomer;
  }
  function manualDiscountAmount(subtotal){
    var val = parseFloat(state.discountValue) || 0;
    if(val <= 0) return 0;
    if(state.discountType === 'fixed') return Math.min(subtotal, val);
    return Math.min(subtotal, subtotal * (val / 100));
  }
  function pointsDiscountAmount(subtotal){
    var custRec = attachedCustomerRecord();
    if(!custRec) return 0;
    var pts = Math.max(0, Math.floor(state.redeemPoints) || 0);
    pts = Math.min(pts, custRec.points || 0);
    var manual = manualDiscountAmount(subtotal);
    var remaining = Math.max(0, subtotal - manual);
    return Math.min(pts * (state.loyaltySettings.pointValueEGP || 0), remaining);
  }
  function cartDiscountTotal(){
    var subtotal = cartTotal();
    return manualDiscountAmount(subtotal) + pointsDiscountAmount(subtotal);
  }
  function refocusInput(id){
    var el = document.getElementById(id);
    if(el){ el.focus(); var v = el.value; el.value=''; el.value=v; }
  }
  function toggleDiscountForm(){ state.showDiscountForm = !state.showDiscountForm; render(); }
  window.toggleDiscountForm = toggleDiscountForm;
  function setDiscountType(v){ state.discountType = v; render(); }
  window.setDiscountType = setDiscountType;
  function setDiscountValue(v){ state.discountValue = v; render(); refocusInput('discValInput'); }
  window.setDiscountValue = setDiscountValue;
  function setDiscountReason(v){ state.discountReason = v; render(); refocusInput('discReasonInput'); }
  window.setDiscountReason = setDiscountReason;
  function setRedeemPoints(v){ state.redeemPoints = Math.max(0, parseInt(v,10)||0); render(); refocusInput('redeemPtsInput'); }
  window.setRedeemPoints = setRedeemPoints;
  function useMaxPoints(){
    var custRec = attachedCustomerRecord();
    if(!custRec) return;
    var subtotal = cartTotal();
    var manual = manualDiscountAmount(subtotal);
    var remaining = Math.max(0, subtotal - manual);
    var pointValue = state.loyaltySettings.pointValueEGP || 0;
    var maxPts = pointValue > 0 ? Math.floor(remaining / pointValue) : 0;
    state.redeemPoints = Math.min(custRec.points || 0, maxPts);
    render();
  }
  window.useMaxPoints = useMaxPoints;
  function clearDiscountForm(){
    state.showDiscountForm = false; state.discountType = 'percent'; state.discountValue = ''; state.discountReason = ''; state.redeemPoints = 0;
    render();
  }
  window.clearDiscountForm = clearDiscountForm;

  function renderDiscountWidget(subtotal){
    var custRec = attachedCustomerRecord();
    var totalDiscount = cartDiscountTotal();
    if(!state.showDiscountForm && totalDiscount <= 0){
      return '<button class="customer-add-btn" onclick="toggleDiscountForm()">+ إضافة خصم (اختياري)</button>';
    }

      + '<option value="percent"'+(state.discountType==='percent'?' selected':'')+'>نسبة %</option>'
      + '<option value="fixed"'+(state.discountType==='fixed'?' selected':'')+'>مبلغ ثابت ج.م</option>'
      + '</select>';
    var pointsSection = '';
    if(custRec){
      var custPoints = custRec.points || 0;
      var pointValue = state.loyaltySettings.pointValueEGP || 0;
      pointsSection = '<div class="recipe-summary">العميل عنده '+custPoints+' نقطة (بتساوي '+money(custPoints*pointValue)+' ج.م)</div>'
        + '<div class="field-row" style="margin-top:2px;">'
          + '<div class="field"><label>نقط هتتخصم دلوقتي</label><input id="redeemPtsInput" type="number" min="0" max="'+custPoints+'" value="'+(state.redeemPoints||0)+'" oninput="setRedeemPoints(this.value)"></div>'
          + '<div style="display:flex;align-items:flex-end;"><button class="btn btn-ghost btn-sm" onclick="useMaxPoints()">أقصى استخدام</button></div>'
        + '</div>';
    }
    return '<div class="customer-picker">'
      + '<div class="field-row">'
        + '<div class="field"><label>نوع الخصم</label>'+typeSelect+'</div>'
        + '<div class="field"><label>القيمة</label><input id="discValInput" type="number" min="0" value="'+escAttr(state.discountValue||'')+'" oninput="setDiscountValue(this.value)"></div>'
      + '</div>'
      + '<div class="field"><label>السبب (اختياري)</label><input id="discReasonInput" placeholder="مثال: عرض، موظف، شكوى" value="'+escAttr(state.discountReason||'')+'" oninput="setDiscountReason(this.value)"></div>'
      + pointsSection
      + (totalDiscount > 0 ? '<div class="recipe-summary" style="color:var(--brand-deep);font-weight:600;">إجمالي الخصم: '+money(totalDiscount)+' ج.م</div>' : '')
      + '<div style="display:flex;gap:8px;"><button class="btn btn-ghost btn-sm" onclick="clearDiscountForm()">إلغاء الخصم</button></div>'
      + '</div>';
  }

  /* ----- Customer attach widget (inside the cart) ----- */
  function renderCustomerWidget(){
    if(state.attachedCustomer){
      var c = attachedCustomerRecord() || state.attachedCustomer;
      var pts = c.points || 0;
      return '<div class="customer-chip"><span class="who">👤 '+esc(c.name)+' <small>'+esc(c.phone||'')+' - '+pts+' نقطة</small></span><button onclick="removeAttachedCustomer()" title="شيل العميل">×</button></div>';

  /* ----- QR scan (native BarcodeDetector; no external library) ----- */
  var qrScanStream = null;
  var qrScanTimer = null;
  var qrScanDetector = null;

  function startQrScan(){
    var modal = document.getElementById('scanModal');
    var statusEl = document.getElementById('scanStatus');
    if(!modal || !statusEl) return;
    modal.hidden = false;
    statusEl.textContent = 'بيفتح الكاميرا…';
    if(!('BarcodeDetector' in window)){
      statusEl.textContent = 'المتصفح ده مش بيدعم مسح QR بالكاميرا. استخدم "+ إضافة عميل" وابحث بالاسم أو الرقم بدل كده.';
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      statusEl.textContent = 'مفيش وصول لكاميرا الجهاز من هنا.';
      return;
    }
    try{ qrScanDetector = new BarcodeDetector({ formats: ['qr_code'] }); }
    catch(e){ statusEl.textContent = 'تعذر تشغيل ماسح الأكواد في المتصفح ده.'; return; }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(stream){
      qrScanStream = stream;
      var video = document.getElementById('scanVideo');
      video.srcObject = stream;
      statusEl.textContent = 'وجّه الكاميرا على كود العميل…';
      qrScanTimer = setInterval(function(){
        if(!qrScanDetector) return;
        qrScanDetector.detect(video).then(function(codes){
          if(codes && codes.length) handleScannedCode(codes[0].rawValue);
        }).catch(function(){});
      }, 350);
    }).catch(function(){
      statusEl.textContent = 'تعذر فتح الكاميرا - لازم توافق على إذن الكاميرا من المتصفح.';
    });
  }
  window.startQrScan = startQrScan;

  function stopQrScan(){
    if(qrScanTimer){ clearInterval(qrScanTimer); qrScanTimer = null; }
    if(qrScanStream){ qrScanStream.getTracks().forEach(function(t){ t.stop(); }); qrScanStream = null; }
    qrScanDetector = null;
    var modal = document.getElementById('scanModal');
    if(modal) modal.hidden = true;
  }
  window.stopQrScan = stopQrScan;

  function handleScannedCode(code){
    var found = state.customers.find(function(c){ return c.loyaltyCode === code; });
    stopQrScan();
    if(!found){ showToast('الكود ده مش متسجل لأي عميل'); return; }
    state.attachedCustomer = { id: found._id, name: found.name, phone: found.phone };
    state.showCustomerPicker = false;
    state.redeemPoints = 0;
    render();
    showToast('اتربط الطلب بالعميل '+found.name);
  }

  // Total quantity of `itemId` already in the cart, across all of its size variants combined
  // (stock is tracked per menu item, not per variant, since recipes aren't size-specific).
  function currentCartQtyForItem(itemId){
    return state.cart.reduce(function(s,l){ return (l.itemId||l.id) === itemId ? s + l.qty : s; }, 0);
  }

  function addToCart(id){
    var item = state.menuItems.find(function(i){ return i.id === id; });
    if(!item) return;
    if(Array.isArray(item.variants) && item.variants.length){ openVariantPicker(id); return; }
    var currentQty = currentCartQtyForItem(id);
    if(currentQty + 1 > availableQty(item)){ showToast('الكمية دي خلصت من المخزون'); return; }
    var line = state.cart.find(function(l){ return l.id === id; });
    if(line){ line.qty += 1; } else { state.cart.push({id:item.id, itemId:item.id, variantId:null, name:item.name, price:item.price, qty:1}); }
    saveCartDraft(); render();
  }
  window.addToCart = addToCart;

  function changeQty(id, delta){
    var line = state.cart.find(function(l){ return l.id === id; });
    if(!line) return;
    var itemId = line.itemId || line.id;
    if(delta > 0){
      var item = state.menuItems.find(function(i){ return i.id === itemId; });
      var currentQty = currentCartQtyForItem(itemId);
      if(currentQty + delta > availableQty(item)){ showToast('الكمية دي خلصت من المخزون'); return; }
    }
    line.qty += delta;
    if(line.qty <= 0){ state.cart = state.cart.filter(function(l){ return l.id !== id; }); }
    saveCartDraft(); render();
  }
  window.changeQty = changeQty;

  function addVariantToCart(itemId, variantId){
    var item = state.menuItems.find(function(i){ return i.id === itemId; });
    if(!item) return;
    var variant = (item.variants||[]).find(function(v){ return v.id === variantId; });
    if(!variant) return;
    var currentQty = currentCartQtyForItem(itemId);
    if(currentQty + 1 > availableQty(item)){ showToast('الكمية دي خلصت من المخزون'); return; }
    var lineKey = itemId + '::' + variantId;
    var line = state.cart.find(function(l){ return l.id === lineKey; });
    if(line){ line.qty += 1; } else { state.cart.push({id:lineKey, itemId:itemId, variantId:variantId, name:item.name+' ('+variant.name+')', price:variant.price, qty:1}); }
    state.variantPickerItemId = null;
    saveCartDraft(); render();
  }
  window.addVariantToCart = addVariantToCart;

  function renderVariantModal(){
    var modal = document.getElementById('variantModal');
    if(!modal) return;
    var itemId = state.variantPickerItemId;

  function checkout(){
    if(!state.cart.length) return;
    var activeShift = currentShift();
    if(!activeShift){ showToast('لازم تفتح الشيفت الأول من تبويب "الشيفت"'); setTab('shift'); return; }

    var subtotal = cartTotal();
    var manualDiscount = manualDiscountAmount(subtotal);
    var custRec = attachedCustomerRecord();
    var redeemPts = 0, ptsDiscount = 0;
    if(custRec){
      var afterManual = Math.max(0, subtotal - manualDiscount);
      var pointValue = state.loyaltySettings.pointValueEGP || 0;
      redeemPts = Math.min(Math.max(0, Math.floor(state.redeemPoints) || 0), custRec.points || 0);
      ptsDiscount = Math.min(redeemPts * pointValue, afterManual);
      if(pointValue > 0) redeemPts = Math.min(redeemPts, Math.ceil(ptsDiscount / pointValue));
    }
    var totalDiscount = manualDiscount + ptsDiscount;
    var total = Math.max(0, subtotal - totalDiscount);
    var pointsEarned = state.loyaltySettings.earnEveryEGP > 0 ? Math.floor(total / state.loyaltySettings.earnEveryEGP) : 0;

    var key = todayKey();
    var todaysCount = state.orders.filter(function(o){ return o.dateKey === key; }).length;
    var order = {
      orderNumber: todaysCount + 1,
      items: state.cart.map(function(l){ return {id:l.id, itemId:l.itemId||l.id, variantId:l.variantId||null, name:l.name, price:l.price, qty:l.qty}; }),
      subtotal: subtotal,
      discount: totalDiscount,
      discountDetail: {
        manualType: manualDiscount > 0 ? state.discountType : null,
        manualValue: manualDiscount > 0 ? (parseFloat(state.discountValue) || 0) : 0,
        manualAmount: manualDiscount,
        manualReason: manualDiscount > 0 ? (state.discountReason || '') : '',
        pointsRedeemed: redeemPts,
        pointsDiscount: ptsDiscount
      },
      pointsEarned: pointsEarned,
      total: total,
      paymentMethod: state.payMethod,
      createdAt: new Date().toISOString(),
      dateKey: key,
      shiftId: activeShift._id,
      cashierName: state.currentUser ? state.currentUser.name : '',
      customerId: state.attachedCustomer ? state.attachedCustomer.id : null,
      customerName: state.attachedCustomer ? state.attachedCustomer.name : '',
      customerPhone: state.attachedCustomer ? state.attachedCustomer.phone : ''
    };
    deductInventoryForCart(state.cart);

    if(custRec){
      var newPoints = Math.max(0, (custRec.points || 0) - redeemPts + pointsEarned);
      if(db && customersColRef && String(custRec._id).indexOf('local') !== 0){
        customersColRef.doc(custRec._id).update({ points: newPoints }).catch(function(){});
      } else {
        var localC = state.customers.find(function(c){ return c._id === custRec._id; });
        if(localC) localC.points = newPoints;
      }
    }

    if(db && ordersColRef){
      ordersColRef.add(order).then(function(ref){
        order._id = ref.id;
        openReceipt(order);
      }).catch(function(){ showToast('الطلب اتحفظ محليًا بس - حصل خطأ في المزامنة'); order._id = uid('local'); state.orders.unshift(order); openReceipt(order); });
    } else {
      order._id = uid('local');
      state.orders.unshift(order);
      openReceipt(order);
    }
    state.cart = [];
    state.attachedCustomer = null;
    clearDiscountForm();
    saveCartDraft();
    render();
  }
  window.checkout = checkout;

  /* ----- Item photo editor (inside Menu tab) - uses the 'assets' capability ----- */
  // Downscales/re-encodes to a reasonable JPEG before upload so a phone camera photo
  // doesn't blow past the size limit and so the POS grid stays fast to load.
  function resizeImageFile(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(url);
        var w = img.naturalWidth || 1, h = img.naturalHeight || 1;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        canvas.toBlob(function(blob){ if(blob) resolve(blob); else reject(new Error('toBlob failed')); }, 'image/jpeg', quality);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
      img.src = url;
    });
  }

  // Photos are stored directly as compressed base64 data URIs inside each item's own
  // Firestore document (menuItems/{id}) - no separate file-storage service needed at all,
  // so this works purely on the free Firestore tier. it.img holds whatever picture is
  // currently showing (default seed photo, generated placeholder, or a real admin upload);
  // it.imgIsCustom is only set once an admin uploads their own photo, so the version-seed
  // backfill in startDbListeners() knows never to overwrite it with a newer default.
  function fileToDataUri(blob){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ reject(new Error('read failed')); };
      reader.readAsDataURL(blob);
    });
  }

  function handleItemImageFile(itemId, inputEl){

    showToast('بيجهز الصورة…');
    resizeImageFile(file, 640, 0.75).then(function(blob){
      return fileToDataUri(blob);
    }).then(function(dataUri){
      var it = state.menuItems.find(function(i){ return i.id === itemId; });
      if(it){ it.img = dataUri; it.imgIsCustom = true; }
      persistMenu();
      showToast('اتضافت الصورة');
    }).catch(function(){
      showToast('حصل خطأ أثناء تجهيز الصورة - جرب صورة تانية');

  }

  /* ----- Shift / cash drawer tab ----- */
  function computeShiftStats(shiftId){
    var ordersInShift = state.orders.filter(function(o){ return o.shiftId === shiftId; });
    var totalsByMethod = {};
    ordersInShift.forEach(function(o){
      var m = o.paymentMethod || 'غير محدد';
      totalsByMethod[m] = (totalsByMethod[m]||0) + (o.total||0);
    });
    var totalSales = ordersInShift.reduce(function(s,o){ return s + (o.total||0); }, 0);
    return { orders: ordersInShift, totalsByMethod: totalsByMethod, totalSales: totalSales, orderCount: ordersInShift.length };
  }

  function openShift(){
    var name = state.currentUser ? state.currentUser.name : '';
    var opening = parseFloat(document.getElementById('shift_opening').value);
    if(!name){ showToast('لازم تكون مسجل دخول'); return; }
    if(currentShift()){ showToast('في شيفت مفتوح بالفعل'); return; }
    if(isNaN(opening) || opening < 0){ showToast('اكتب رصيد افتتاحي صحيح'); return; }
    var shift = { cashierName: name, openingCash: opening, status: 'open', openedAt: new Date().toISOString(), closedAt: null };
    if(db && shiftsColRef){
      shiftsColRef.add(shift).then(function(ref){ showToast('اتفتح الشيفت'); }).catch(function(){ showToast('حصل خطأ - جرب تاني'); });
    } else {
      shift._id = uid('local');
      state.shifts.unshift(shift);
      showToast('اتفتح الشيفت (وضع محلي)');
    }
    render();
  }

  function closeShift(id){
    var input = document.getElementById('shift_closing_cash');
    var counted = parseFloat(input.value);
    if(isNaN(counted) || counted < 0){ showToast('اكتب قيمة الكاش الفعلي في الدرج'); return; }
    var shift = state.shifts.find(function(s){ return s._id === id; });
    if(!shift) return;
    var stats = computeShiftStats(id);
    var cashSales = stats.totalsByMethod['نقدي'] || 0;
    var expectedCash = shift.openingCash + cashSales;
    var variance = counted - expectedCash;
    var patch = {
      status: 'closed', closedAt: new Date().toISOString(),
      closingCashCounted: counted, expectedCash: expectedCash, cashVariance: variance,
      totalsByMethod: stats.totalsByMethod, totalSales: stats.totalSales, orderCount: stats.orderCount
    };
    if(db && shiftsColRef && String(id).indexOf('local') !== 0){
      shiftsColRef.doc(id).update(patch).catch(function(){ showToast('حصل خطأ أثناء إغلاق الشيفت'); });
    } else {
      Object.assign(shift, patch);
    }
    state.closingShiftId = null;
    render();
    showToast('اتقفل الشيفت');
  }

  function renderMethodBreakdown(totalsByMethod){

          + '<div style="display:flex;align-items:flex-end;"><button class="btn btn-primary" onclick="openShift()">فتح الشيفت</button></div>'
        + '</div></div>';
    }

    var historyRows = closedShifts.map(function(s){
      var out = (s.cashVariance||0) < 0;
      var over = (s.cashVariance||0) > 0;
      var varClass = out ? 'out' : (over ? 'low' : 'ok');
      var varText = (s.cashVariance>0?'+':'')+money(s.cashVariance||0)+' ج.م';
      var rangeTxt = timeLabel(s.openedAt)+' → '+timeLabel(s.closedAt);
      var row = '<tr>'
        + '<td>'+new Date(s.openedAt).toLocaleDateString('ar-EG')+'</td>'
        + '<td>'+esc(s.cashierName)+'</td>'
        + '<td>'+rangeTxt+'</td>'
        + '<td class="num">'+money(s.totalSales||0)+' ج.م</td>'
        + '<td><span class="stock-pill '+varClass+'">'+varText+'</span></td>'
        + '<td style="text-align:left;"><button class="btn btn-ghost btn-sm" onclick="toggleShiftDetails(\''+escAttr(s._id)+'\')">'+(state.expandedShiftId===s._id?'إخفاء':'التفاصيل')+'</button></td>'
        + '</tr>';

        row += '<tr><td colspan="6"><div class="recipe-panel">'

          + '<div class="receipt-line"><span class="n">الرصيد الافتتاحي</span><span class="p">'+money(s.openingCash||0)+' ج.م</span></div>'

      + '<div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>التاريخ</th><th>الكاشير</th><th>من - لحد</th><th class="num">المبيعات</th><th>الفرق</th><th></th></tr></thead><tbody>'+(historyRows || '<tr><td colspan="6" class="empty-note">لسه مفيش شيفتات مقفولة</td></tr>')+'</tbody></table></div>'

  /* ----- Reports tab ----- */
  function renderReports(){
    var key = todayKey();
    var todays = state.orders.filter(function(o){ return o.dateKey === key; });
    var revenue = todays.reduce(function(s,o){ return s + (o.total||0); }, 0);
    var count = todays.length;
    var avg = count ? revenue / count : 0;
    var discountsToday = todays.reduce(function(s,o){ return s + (o.discount||0); }, 0);

    var qtyByItem = {};
    todays.forEach(function(o){
      (o.items||[]).forEach(function(it){
        qtyByItem[it.name] = (qtyByItem[it.name]||0) + it.qty;
      });
    });
    var ranked = Object.keys(qtyByItem).map(function(name){ return {name:name, qty:qtyByItem[name]}; }).sort(function(a,b){ return b.qty - a.qty; }).slice(0,8);
    var maxQty = ranked.length ? ranked[0].qty : 1;
    var topName = ranked.length ? ranked[0].name : '—';

    var bars = ranked.map(function(r){
      var pct = Math.max(6, Math.round((r.qty/maxQty)*100));
      return '<div class="bar-row"><div class="bar-label">'+esc(r.name)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div><div class="bar-value">'+r.qty+' قطعة</div></div>';
    }).join('') || '<div class="empty-note">لسه مفيش مبيعات النهارده</div>';

    var rows = todays.map(function(o){
      return '<tr>'
        + '<td class="num">#'+o.orderNumber+'</td>'
        + '<td>'+timeLabel(o.createdAt)+'</td>'
        + '<td>'+((o.items||[]).reduce(function(s,i){return s+i.qty;},0))+' صنف</td>'
        + '<td>'+esc(o.paymentMethod||'')+'</td>'
        + '<td class="num">'+money(o.total)+' ج.م</td>'
        + '<td style="text-align:left;"><button class="btn btn-ghost btn-sm" onclick=\'openReceiptFromOrder("'+o._id+'")\'>عرض الفاتورة</button></td>'
        + '</tr>';
    }).join('');

    var lowStock = state.inventory.filter(function(g){ return g.stock <= (g.lowStockAt!=null?g.lowStockAt:0); });
    var lowRows = lowStock.map(function(g){
      var out = g.stock<=0;
      return '<div class="bar-row"><div class="bar-label">'+esc(g.name)+'</div><div style="flex:1;"></div><span class="stock-pill '+(out?'out':'low')+'">'+money(g.stock)+' '+esc(g.unit)+'</span></div>';
    }).join('');
    var alertsSection = lowStock.length ? '<div class="section-card"><div class="section-title">⚠️ تنبيهات المخزون</div>'+lowRows+'</div>' : '';

    return '<div class="stat-grid">'
      + statTile('إجمالي مبيعات اليوم', money(revenue)+' ج.م')
      + statTile('عدد الطلبات', String(count))
      + statTile('متوسط قيمة الطلب', money(avg)+' ج.م')
      + statTile('الأكثر مبيعًا', topName)
      + statTile('إجمالي الخصومات اليوم', money(discountsToday)+' ج.م')
      + '</div>'
      + alertsSection
      + '<div class="section-card"><div class="section-title">الأصناف الأكثر مبيعًا اليوم</div>'+bars+'</div>'
      + '<div class="section-card"><div class="section-title">طلبات اليوم</div>'
      + '<div style="overflow-x:auto;"><table class="data-table"><thead><tr><th class="num">رقم</th><th>الوقت</th><th>الأصناف</th><th>الدفع</th><th class="num">الإجمالي</th><th></th></tr></thead><tbody>'+(rows || '<tr><td colspan="6" class="empty-note">لسه مفيش طلبات النهارده</td></tr>')+'</tbody></table></div>'
      + '</div>';
  }
  function statTile(lbl, val){
    return '<div class="stat-tile"><div class="lbl">'+esc(lbl)+'</div><div class="val">'+val+'</div></div>';
  }
  function openReceiptFromOrder(id){
    var o = state.orders.find(function(x){ return x._id === id; });
    if(o) openReceipt(o);
  }
  window.openReceiptFromOrder = openReceiptFromOrder;

  /* ---------------- Utils ---------------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function escAttr(s){ return esc(s).replace(/"/g, '&quot;'); }

  /* ---------------- Boot ---------------- */
  loadCartDraft();
  restoreSession(); // works even offline, against the local DEFAULT_STAFF fallback
  render();
  initDb();
})();
</script>

</html>
